<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SakuraVerse | Personal Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700;800;900&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Quicksand', 'M PLUS Rounded 1c', sans-serif;
        background-color: #fdf2f8;
        background-image: radial-gradient(#fbcfe8 1.5px, transparent 1.5px);
        background-size: 24px 24px;
        overflow-x: hidden;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(236, 72, 153, 0.5);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(236, 72, 153, 0.8);
      }

      .font-rounded {
        font-family: 'M PLUS Rounded 1c', sans-serif;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
      }

      /* Sakura Animation */
      .sakura-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .sakura {
        position: absolute;
        background-color: #ffb7b2;
        border-radius: 100% 0 100% 0;
        opacity: 0.6;
        animation: fall linear infinite;
      }
      @keyframes fall {
        0% { opacity: 0; top: -10%; transform: translateX(0) rotate(0deg); }
        10% { opacity: 0.8; }
        100% { opacity: 0; top: 110%; transform: translateX(100px) rotate(360deg); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.29.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <!-- Sakura Generator Script -->
    <script>
      const container = document.createElement('div');
      container.className = 'sakura-container';
      document.body.appendChild(container);

      function createSakura() {
        const el = document.createElement('div');
        el.className = 'sakura';
        const size = Math.random() * 10 + 5 + 'px';
        el.style.width = size;
        el.style.height = size;
        el.style.left = Math.random() * 100 + 'vw';
        el.style.animationDuration = Math.random() * 5 + 5 + 's';
        el.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(el);
        
        // Remove after animation
        setTimeout(() => {
          el.remove();
        }, 11000);
      }

      setInterval(createSakura, 300);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
