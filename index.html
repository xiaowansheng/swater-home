<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SakuraVerse | Personal Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700;800;900&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Sakura Generator Script -->
    <script>
      const container = document.createElement('div');
      container.className = 'sakura-container';
      document.body.appendChild(container);

      function createSakura() {
        const el = document.createElement('div');
        el.className = 'sakura';
        const size = Math.random() * 10 + 5 + 'px';
        el.style.width = size;
        el.style.height = size;
        el.style.left = Math.random() * 100 + 'vw';
        el.style.animationDuration = Math.random() * 5 + 5 + 's';
        el.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(el);
        
        // Remove after animation
        setTimeout(() => {
          el.remove();
        }, 11000);
      }

      setInterval(createSakura, 300);
    </script>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
