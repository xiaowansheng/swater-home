<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="sakuraGradientApple" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#fb7185" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="glowApple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="holoBorderApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="33%" stop-color="#60a5fa"/>
      <stop offset="66%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bgGradientApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a1e"/>
      <stop offset="50%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0f0a1e"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="180" height="180" rx="40" fill="url(#bgGradientApple)"/>

  <!-- 装饰星星 -->
  <g fill="#fff" opacity="0.7">
    <path d="M25 30 L27 36 L33 38 L27 40 L25 46 L23 40 L17 38 L23 36 Z">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M150 25 L152 31 L158 33 L152 35 L150 41 L148 35 L142 33 L148 31 Z">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M155 140 L157 146 L163 148 L157 150 L155 156 L153 150 L147 148 L153 146 Z">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <circle cx="35" cy="145" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="55" r="2.5" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 主樱花 -->
  <g transform="translate(90, 90)" filter="url(#glowApple)">
    <ellipse cx="0" cy="-28" rx="17" ry="28" fill="url(#sakuraGradientApple)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-28" rx="17" ry="28" fill="url(#sakuraGradientApple)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-28" rx="17" ry="28" fill="url(#sakuraGradientApple)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-28" rx="17" ry="28" fill="url(#sakuraGradientApple)" transform="rotate(216)"/>
    <ellipse cx="0" cy="-28" rx="17" ry="28" fill="url(#sakuraGradientApple)" transform="rotate(288)"/>

    <!-- 花心 -->
    <circle cx="0" cy="0" r="11" fill="#ffd6e8"/>
    <circle cx="0" cy="0" r="7" fill="#fb7185"/>

    <!-- 花心装饰 -->
    <g fill="#fff" opacity="0.85">
      <circle cx="0" cy="-3.5" r="1.5"/>
      <circle cx="3" cy="1.8" r="1.3"/>
      <circle cx="-3" cy="1.8" r="1.3"/>
      <circle cx="2" cy="-2" r="1"/>
      <circle cx="-2" cy="-2" r="1"/>
    </g>
  </g>

  <!-- 霓虹边框 -->
  <rect x="2" y="2" width="176" height="176" rx="38" fill="none" stroke="url(#holoBorderApple)" stroke-width="2" opacity="0.5"/>

  <!-- 光点 -->
  <circle cx="55" cy="55" r="3" fill="#22d3ee" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="125" cy="125" r="3" fill="#fb7185" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>