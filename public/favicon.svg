<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 樱花渐变 -->
    <radialGradient id="sakuraGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#fb7185" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.85"/>
    </radialGradient>

    <!-- 光晕效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 星星光芒 -->
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- 霓虹边框渐变 -->
    <linearGradient id="holoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="33%" stop-color="#60a5fa"/>
      <stop offset="66%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="64" height="64" rx="14" fill="url(#bgGradient)"/>

  <!-- 装饰性星星 -->
  <g fill="#ffffff" filter="url(#starGlow)" opacity="0.8">
    <!-- 小星星 -->
    <path d="M8 10 L8.5 11.5 L10 12 L8.5 12.5 L8 14 L7.5 12.5 L6 12 L7.5 11.5 Z" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M52 8 L52.5 9.5 L54 10 L52.5 10.5 L52 12 L51.5 10.5 L50 10 L51.5 9.5 Z" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M56 48 L56.5 49.5 L58 50 L56.5 50.5 L56 52 L55.5 50.5 L54 50 L55.5 49.5 Z" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="14" cy="52" r="1.2" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="28" r="1" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 主樱花图案 -->
  <g transform="translate(32, 32)" filter="url(#glow)">
    <!-- 樱花五片花瓣 -->
    <g>
      <!-- 旋转动画 -->
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      <!-- 花瓣1 -->
      <ellipse cx="0" cy="-10" rx="6" ry="10" fill="url(#sakuraGradient)" transform="rotate(0)"/>
      <!-- 花瓣2 -->
      <ellipse cx="0" cy="-10" rx="6" ry="10" fill="url(#sakuraGradient)" transform="rotate(72)"/>
      <!-- 花瓣3 -->
      <ellipse cx="0" cy="-10" rx="6" ry="10" fill="url(#sakuraGradient)" transform="rotate(144)"/>
      <!-- 花瓣4 -->
      <ellipse cx="0" cy="-10" rx="6" ry="10" fill="url(#sakuraGradient)" transform="rotate(216)"/>
      <!-- 花瓣5 -->
      <ellipse cx="0" cy="-10" rx="6" ry="10" fill="url(#sakuraGradient)" transform="rotate(288)"/>

      <!-- 花心 -->
      <circle cx="0" cy="0" r="4" fill="#ffd6e8"/>
      <circle cx="0" cy="0" r="2.5" fill="#fb7185"/>

      <!-- 花心装饰点 -->
      <g fill="#ffffff" opacity="0.8">
        <circle cx="0" cy="-1.5" r="0.6"/>
        <circle cx="1.3" cy="0.8" r="0.5"/>
        <circle cx="-1.3" cy="0.8" r="0.5"/>
      </g>
    </g>
  </g>

  <!-- 霓虹边框 -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#holoBorder)" stroke-width="1.5" opacity="0.6"/>

  <!-- 光点装饰 -->
  <g fill="#22d3ee" filter="url(#starGlow)">
    <circle cx="20" cy="20" r="1.5" opacity="0.7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#fb7185" filter="url(#starGlow)">
    <circle cx="44" cy="44" r="1.5" opacity="0.7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>